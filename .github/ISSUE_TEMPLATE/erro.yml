name: Relatar um erro
description: Algo no editor não funcionou como deveria
labels: ["erro"]
body:
  - type: markdown
    attributes:
      value: Obrigado por relatar. Falhas de segurança não vão aqui; veja o SECURITY.md.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: O que você fez, o que esperava e o que aconteceu no lugar.
      placeholder: Gerei uma casa no estilo Arcade e as portas ficaram fora das paredes.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      description: Os passos, um por linha. Se for um modelo gerado, diga o gerador, o estilo, as opções e a semente.
      placeholder: |
        1. Aba Criar, estilo Arcade
        2. Interior, tipo Casa, tamanho Médio
        3. Semente 603621
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do editor
      placeholder: 0.1.0, ou o commit se você roda a partir do código
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: Windows 11 23H2
  - type: textarea
    id: anexos
    attributes:
      label: Imagens ou arquivos
      description: Arraste para cá uma imagem, o arquivo .asmproj ou o GLB exportado, se ajudarem.
