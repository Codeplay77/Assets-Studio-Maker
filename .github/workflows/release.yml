name: Publicar versão

# Compila o instalador do Windows e publica na página de versões.
# Dispara ao enviar uma tag "v*" (ex.: v0.1.0) ou manualmente pela aba Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Assets Studio Maker ${{ github.ref_name }}"
          releaseBody: "Instalador para Windows. Baixe o arquivo `-setup.exe` abaixo."
          releaseDraft: true
          prerelease: false
